# Reference only. The instance runs a remotely-managed tunnel (`cloudflared tunnel run`
# with a token), so these routes are set in the Cloudflare dashboard:
# Zero Trust > Networks > Tunnels > (tunnel) > Public hostnames. This file shows the
# same routes in config-file form, for anyone who prefers a locally-managed tunnel.
#
# Use one-level hostnames (dnd-mcp.example.com, not mcp.dnd.example.com): Cloudflare's
# free Universal SSL certificate covers *.example.com only.
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # dm20 MCP server (streamable HTTP + OAuth sign-in page)
  - hostname: dnd-mcp.example.com
    service: http://127.0.0.1:8000
  # Party Mode (HTTP + WebSocket; cloudflared proxies WebSockets with no extra setting)
  - hostname: dnd-play.example.com
    service: http://127.0.0.1:8080
  - service: http_status:404
